<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F3EF">
<title>毛球日记 · 养宠成长记录与社区</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F5F3EF;--card:#fff;--ink:#2B2A28;--muted:#9A938B;--line:#EDE9E3;--primary:#FF7A59;--primary-soft:#FFEFE9;--green:#3FBF9F;--green-soft:#E8F7F2;--blue:#5B9BFF;--blue-soft:#EAF1FF;--purple:#7C6BE0;--purple-soft:#F0EDFF;--yellow:#E2A021;--yellow-soft:#FFF4E0;--red:#F05A5A;--red-soft:#FFEBEB;--olive:#5A5A3C}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#E9E5DF;color:var(--ink);display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:430px;height:100dvh;max-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:520px){body{background:radial-gradient(1200px 600px at 50% 0%,#F3EFE9 0%,#E4DFD7 100%)}.phone{border-radius:28px;height:92dvh;box-shadow:0 30px 80px rgba(60,45,30,.22),0 0 0 1px rgba(0,0,0,.04)}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;flex:none}
.pet-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;background:#fff;box-shadow:0 2px 12px rgba(90,70,50,.07);cursor:pointer;border:none;font:inherit;color:inherit}
.pet-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;font-size:21px;flex:none;overflow:hidden}
.pet-avatar img{width:100%;height:100%;object-fit:cover}
.pet-meta{text-align:left;line-height:1.25}
.pet-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px}
.caret{font-size:10px;color:var(--muted)}
.pet-sub{font-size:11px;color:var(--muted);margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(255,122,89,.4);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scroll-behavior:smooth}
main::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B5AEA6;font-size:10.5px;font-family:inherit;padding:4px 0;cursor:pointer;transition:color .18s}
.tab svg{width:23px;height:23px;transition:transform .18s}
.tab.active{color:var(--primary);font-weight:600}
.tab.active svg{transform:translateY(-1px) scale(1.06)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 14px rgba(90,70,50,.055)}
.card h3{margin:0;font-size:15px;font-weight:700}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{font-size:11px;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:999px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 10px;letter-spacing:.3px}
.hero{border-radius:20px;padding:18px;margin:4px 0 14px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#FF9A76 0%,#FF7A59 48%,#F2634A 100%);box-shadow:0 10px 26px rgba(255,122,89,.3)}
.hero.senior{background:linear-gradient(135deg,#9B8CFF 0%,#7C6BE0 48%,#6A58D6 100%);box-shadow:0 10px 26px rgba(124,107,224,.3)}
.hero::after{content:"";position:absolute;right:-34px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero-avatar{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.24);display:grid;place-items:center;font-size:26px;flex:none;overflow:hidden;border:2px solid rgba(255,255,255,.4)}
.hero-avatar img{width:100%;height:100%;object-fit:cover}
.hero-title{font-size:17px;font-weight:800;letter-spacing:.2px}
.hero-title b{font-size:22px;margin:0 2px}
.hero-sub{font-size:11.5px;opacity:.88;margin-top:3px}
.stats{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.stat{flex:1;background:rgba(255,255,255,.17);border-radius:12px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:800}
.stat span{font-size:10px;opacity:.86;display:block;margin-top:2px}
.view-switch{display:flex;gap:6px;background:#fff;border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:0 2px 12px rgba(90,70,50,.055)}
.vs-btn{flex:1;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 0;border-radius:9px;cursor:pointer;transition:all .18s}
.vs-btn.on{background:var(--ink);color:#fff}
.chart-scroll{overflow-x:auto;overflow-y:hidden;margin:0 -16px 8px;padding:0 16px}
.chart-scroll::-webkit-scrollbar{display:none}
.chart-svg{display:block;height:auto}
.vtl{position:relative;padding:8px 0}
.vtl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}
.vtl-item{position:relative;display:flex;margin-bottom:22px;align-items:flex-start}
.vtl-item.left{justify-content:flex-start;padding-right:calc(50% + 14px)}
.vtl-item.right{justify-content:flex-end;padding-left:calc(50% + 14px)}
.vtl-dot{position:absolute;left:50%;top:22px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;transform:translateX(-50%);box-shadow:0 2px 8px rgba(255,122,89,.4);z-index:1}
.vtl-card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 12px rgba(90,70,50,.07);width:100%}
.vtl-photo{width:100%;aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#FFF1E9,#FFE6DC);display:grid;place-items:center;font-size:36px;overflow:hidden;margin-bottom:10px}
.vtl-photo img{width:100%;height:100%;object-fit:cover}
.vtl-date{font-size:10.5px;color:var(--muted);font-weight:600}
.vtl-kg{font-size:22px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.vtl-kg span{font-size:12px;color:var(--muted);font-weight:600;margin-left:3px}
.vtl-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:4px}
.tl-item{display:flex;gap:11px}
.tl-rail{display:flex;flex-direction:column;align-items:center;width:44px;flex:none}
.tl-dot{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px rgba(90,70,50,.09);z-index:1;flex:none;overflow:hidden}
.tl-dot img{width:100%;height:100%;object-fit:cover}
.tl-line{flex:1;width:2px;background:var(--line);margin:-3px 0 0}
.tl-body{flex:1;padding-bottom:16px;min-width:0}
.tl-item:last-child .tl-body{padding-bottom:4px}
.tl-item:last-child .tl-line{display:none}
.tl-date{font-size:11px;color:var(--muted);margin:9px 0 6px;font-weight:600}
.tl-card{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 12px rgba(90,70,50,.055)}
.tl-title{font-size:14px;font-weight:700;line-height:1.4}
.tl-desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.tl-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;margin-top:8px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.tl-tag.health{background:var(--blue-soft);color:var(--blue)}
.mini-weight{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 14px rgba(90,70,50,.055);cursor:pointer;border:none;font:inherit;text-align:left;width:100%}
.mw-num{font-size:26px;font-weight:800;letter-spacing:-.5px}
.mw-num span{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.mw-sub{font-size:11px;color:var(--muted);margin-top:2px}
.mw-chart{flex:1;height:36px}
.mw-go{color:var(--primary);font-size:18px;font-weight:700}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none;padding-bottom:0}
.row-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.row-icon.green{background:var(--green-soft)}
.row-icon.blue{background:var(--blue-soft)}
.row-main{flex:1;min-width:0}
.row-title{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:var(--muted);margin-top:2px}
.row-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;flex:none}
.row-status.ok{background:var(--green-soft);color:var(--green)}
.row-status.soon{background:var(--yellow-soft);color:var(--yellow)}
.triage-entry{display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,#FFF6F2,#FFEFE9);border-radius:18px;padding:15px;margin-bottom:12px;cursor:pointer;border:none;font:inherit;text-align:left;width:100%;box-shadow:0 2px 14px rgba(255,122,89,.12)}
.triage-entry .te-icon{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 3px 10px rgba(255,122,89,.18)}
.triage-entry .te-title{font-size:14.5px;font-weight:750;color:#2B2A28}
.triage-entry .te-sub{font-size:11.5px;color:#A78478;margin-top:3px;line-height:1.5}
.triage-entry .te-go{margin-left:auto;font-size:18px;color:var(--primary);flex:none}
.senior-entry{background:linear-gradient(135deg,#F3F0FF,#EAE5FF);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 14px rgba(124,107,224,.12)}
.senior-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.senior-head .se-icon{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.senior-head .se-title{font-size:14.5px;font-weight:750;color:#3D2F8A}
.senior-head .se-sub{font-size:11.5px;color:#7C6BE0;margin-top:3px}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-row .sr-label{width:52px;font-size:12px;color:#5A4BB8;font-weight:600;flex:none}
.score-row .sr-bar{flex:1}
.score-row input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:999px;background:#DDD6FF;outline:none;margin:0}
.score-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#7C6BE0;border:3px solid #fff;box-shadow:0 2px 8px rgba(124,107,224,.4);cursor:pointer}
.score-row .sr-val{width:18px;font-size:13px;font-weight:700;color:#7C6BE0;text-align:right}
.score-summary{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(124,107,224,.18)}
.score-summary .ss-total{font-size:13px;color:#5A4BB8;font-weight:650}
.score-summary .ss-total b{font-size:22px;font-weight:800;color:#7C6BE0;margin-right:2px}
.score-save{border:none;background:#7C6BE0;color:#fff;font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:999px;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(124,107,224,.35)}
.score-trend{margin-top:10px;font-size:11.5px;color:#7C6BE0}
.loc-bar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px}
.loc-bar .loc{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px}
.loc-bar .switch{font-size:11.5px;color:var(--primary);font-weight:600;background:var(--primary-soft);padding:5px 11px;border-radius:999px;border:none;font-family:inherit;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.mapcard{height:150px;border-radius:18px;margin-bottom:14px;position:relative;overflow:hidden;background:linear-gradient(160deg,#EAF3EE 0%,#E3EEF6 100%)}
.mapcard .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.85) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.85) 1px,transparent 1px);background-size:34px 34px}
.mapcard .road{position:absolute;background:rgba(255,255,255,.9);border-radius:3px}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.pin span{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 3px 10px rgba(60,80,90,.18);border:2px solid #fff}
.pin.me span{background:var(--primary);color:#fff;width:38px;height:38px;font-size:17px;box-shadow:0 4px 14px rgba(255,122,89,.5)}
.friend{background:#fff;border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 2px 12px rgba(90,70,50,.055)}
.friend-top{display:flex;align-items:center;gap:12px}
.f-avatar{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:23px;flex:none;position:relative;overflow:hidden}
.f-avatar .dot{position:absolute;right:2px;bottom:2px;width:11px;height:11px;border-radius:50%;background:#C9C3BC;border:2px solid #fff}
.f-avatar .dot.on{background:var(--green)}
.f-main{flex:1;min-width:0}
.f-name{font-size:14px;font-weight:700}
.f-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.f-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.f-tag{font-size:10px;background:var(--bg);color:var(--muted);padding:2px 8px;border-radius:999px}
.friend-posts{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.fp-label{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.fp-card{background:var(--bg);border-radius:11px;padding:9px 11px;font-size:12px;color:#5A554F;line-height:1.5;cursor:pointer;border:none;font-family:inherit;text-align:left;width:100%;display:block}
.fp-card .fp-time{font-size:10px;color:var(--muted);margin-bottom:3px}
.fp-empty{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:11px;padding:9px 11px;text-align:center}
.friend-acts{display:flex;gap:8px;margin-top:10px}
.fa-btn{flex:1;border:none;font-family:inherit;font-size:12px;font-weight:700;padding:8px 0;border-radius:999px;cursor:pointer}
.fa-btn.primary{background:var(--primary-soft);color:var(--primary)}
.fa-btn.primary.done{background:var(--bg);color:var(--muted)}
.fa-btn.ghost{background:var(--bg);color:var(--ink)}
.caregiver{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 12px rgba(90,70,50,.055)}
.cg-avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#EAF1FF,#DDE8FF);display:grid;place-items:center;font-size:23px;flex:none;position:relative;overflow:hidden}
.cg-avatar .badge{position:absolute;right:-2px;bottom:-2px;background:var(--green);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:999px;border:2px solid #fff;z-index:1}
.cg-main{flex:1;min-width:0}
.cg-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cg-star{font-size:11px;color:#E2A021;font-weight:700}
.cg-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.cg-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.cg-tag{font-size:10px;background:var(--blue-soft);color:var(--blue);padding:2px 8px;border-radius:999px;font-weight:600}
.cg-btn{border:none;font-family:inherit;font-size:12px;font-weight:700;padding:8px 13px;border-radius:999px;background:var(--primary);color:#fff;cursor:pointer;flex:none;box-shadow:0 4px 12px rgba(255,122,89,.3)}
.cg-price{font-size:12px;font-weight:700;color:var(--primary);margin-top:3px}
.match-loading{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:11px 13px;margin-bottom:14px;box-shadow:0 2px 12px rgba(90,70,50,.055);cursor:pointer}
.composer-avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;font-size:17px;flex:none}
.composer-input{flex:1;font-size:13px;color:var(--muted)}
.composer-btn{border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:7px 15px;border-radius:999px;font-family:inherit}
.post{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px rgba(90,70,50,.055);transition:box-shadow .3s}
.post.flash{animation:flash 2.4s ease}
@keyframes flash{0%,100%{box-shadow:0 2px 12px rgba(90,70,50,.055)}15%,55%{box-shadow:0 0 0 3px var(--primary),0 8px 24px rgba(255,122,89,.25)}}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.post-avatar{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.post-user{font-size:13.5px;font-weight:700}
.post-time{font-size:11px;color:var(--muted);margin-top:1px}
.post-text{font-size:13.5px;line-height:1.65;color:#3D3A36}
.post-img{height:150px;border-radius:14px;margin-top:11px;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,#FFF1E9,#FFE6DC);overflow:hidden}
.post-img img{width:100%;height:100%;object-fit:cover}
.post-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.post-tag{font-size:11px;color:var(--blue);font-weight:600}
.post-actions{display:flex;gap:26px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.act{display:flex;align-items:center;gap:5px;background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.act.liked{color:var(--primary);font-weight:700}
.post-comments{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none}
.post-comments.open{display:block}
.comment-item{display:flex;gap:9px;margin-bottom:10px}
.c-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px;flex:none}
.c-main{flex:1;min-width:0}
.c-user{font-size:12px;font-weight:700;color:#5A554F}
.c-text{font-size:12.5px;color:#3D3A36;margin-top:2px;line-height:1.55;word-break:break-word}
.c-time{font-size:10px;color:var(--muted);margin-top:2px}
.comment-input-row{display:flex;gap:8px;margin-top:10px}
.comment-input-row input{flex:1;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-size:13px;font-family:inherit;outline:none;color:var(--ink)}
.comment-input-row input:focus{border-color:var(--primary);background:#fff}
.comment-send{border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:0 16px;border-radius:999px;cursor:pointer;font-family:inherit;flex:none}
.comment-empty{text-align:center;font-size:12px;color:var(--muted);padding:10px 0}
.sheet{position:absolute;inset:0;z-index:50;pointer-events:none}
.sheet.open{pointer-events:auto}
.sheet-mask{position:absolute;inset:0;background:rgba(35,28,22,.38);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet.open .sheet-mask{opacity:1}

const today = new Date(); today.setHours(0,0,0,0);
const DAY = 86400000;

function daysAgo(n){ const d=new Date(today); d.setDate(d.getDate()-n); return d; }
function fmtMD(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rel(d){
  const diff=Math.round((today-d)/DAY);
  if(diff<=0)return'今天'; if(diff===1)return'昨天'; if(diff<7)return diff+'天前';
  if(diff<30)return Math.floor(diff/7)+'周前'; return Math.floor(diff/30)+'个月前';
}
function ageText(birth){
  const now=new Date(); let y=now.getFullYear()-birth.getFullYear(); let m=now.getMonth()-birth.getMonth();
  if(m<0||(m===0&&now.getDate()<birth.getDate())){y--;m+=12;}
  return y>0?(y+'岁'+(m>0?m+'个月':'')):(m+'个月');
}
function ageShort(birth, atDate){
  const ref = atDate || new Date();
  const diffDays = Math.max(0, Math.round((ref-birth)/DAY));
  const months = Math.floor(diffDays/30);
  if(months<1) return Math.max(1,Math.floor(diffDays/7))+'周';
  if(months<12) return months+'个月';
  const y = Math.floor(months/12), m = months%12;
  return y+'岁'+(m>0?m+'个月':'');
}
function daysBetween(a,b){ return Math.max(0,Math.round((b-a)/DAY)); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}

function weightRecords(pet){
  return db[pet.id].records.filter(r=>r.type==='weight' && r.kg).sort((a,b)=>a.date-b.date);
}

function growthChartSVG(pet){
  const data = weightRecords(pet);
  if(!data.length) return `<div class="empty"><span class="e">⚖️</span>还没有体重记录<br>点右上角「+」记录第一次吧</div>`;
  const n = data.length;
  const nodeW = 84;
  const padL = 30, padR = 24;
  const W = Math.max(340, padL + padR + (n-1)*nodeW);
  const H = 280;
  const chartTop = 24, chartBottom = 120, photoTop = 138;
  const vals = data.map(d=>d.kg);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(max-min < 0.8){ const c=(max+min)/2; min=c-0.4; max=c+0.4; }
  const pd = (max-min)*0.18; min-=pd; max+=pd;
  const X = i => padL + i*nodeW;
  const Y = v => chartTop + (chartBottom-chartTop)*(1-(v-min)/(max-min));
  let grid = '';
  for(let g=0;g<=3;g++){
    const v = min + (max-min)*(g/3);
    const y = Y(v);
    grid += `<line x1="${padL-10}" y1="${y.toFixed(1)}" x2="${W-padR+6}" y2="${y.toFixed(1)}" stroke="#EDE9E3" stroke-width="1"/>`;
    grid += `<text x="${padL-14}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#9A938B">${v.toFixed(1)}</text>`;
  }
  const pts = data.map((d,i)=>[X(i),Y(d.kg)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[n-1][0].toFixed(1)} ${chartBottom} L ${pts[0][0].toFixed(1)} ${chartBottom} Z`;
  let nodes = '';
  data.forEach((d,i)=>{
    const x = X(i), y = Y(d.kg);
    const cx = x, cy = photoTop + 26;
    const gid = 'clip-'+pet.id+'-'+i;
    const photo = d.photo || pet.photo;
    nodes += `<defs><clipPath id="${gid}"><circle cx="${cx}" cy="${cy}" r="26"/></clipPath></defs>`;
    if(photo){
      nodes += `<image href="${photo}" x="${cx-26}" y="${cy-26}" width="52" height="52" clip-path="url(#${gid})" preserveAspectRatio="xMidYMid slice"/>`;
      nodes += `<circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="#fff" stroke-width="3"/>`;
    } else {
      nodes += `<circle cx="${cx}" cy="${cy}" r="26" fill="#FFF1E9" stroke="#fff" stroke-width="3"/>`;
      nodes += `<text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="26">${pet.emoji}</text>`;
    }
    nodes += `<line x1="${x}" y1="${y}" x2="${x}" y2="${cy-28}" stroke="#EDE9E3" stroke-width="1.2" stroke-dasharray="2 3"/>`;
    nodes += `<circle cx="${x}" cy="${y}" r="4.5" fill="#FF7A59" stroke="#fff" stroke-width="2.2"/>`;
    nodes += `<text x="${x}" y="${cy+48}" text-anchor="middle" font-size="13" font-weight="800" fill="#2B2A28">${d.kg}<tspan font-size="10" fill="#9A938B" font-weight="600"> kg</tspan></text>`;
    nodes += `<text x="${x}" y="${cy+62}" text-anchor="middle" font-size="9.5" fill="#9A938B">${fmtMD(d.date)}</text>`;
    nodes += `<text x="${x}" y="${cy+75}" text-anchor="middle" font-size="9.5" fill="#9A938B">${ageShort(pet.birth, d.date)}</text>`;
  });
  return `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${W}px">
      <defs>
        <linearGradient id="wg-${pet.id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#FF7A59" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      <path d="${area}" fill="url(#wg-${pet.id})"/>
      <path d="${line}" fill="none" stroke="#FF7A59" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${nodes}
    </svg>`;
}

function timelineListHTML(pet){
  const list = db[pet.id].records.slice().sort((a,b)=>b.date-a.date);
  if(!list.length) return `<div class="empty"><span class="e">🐾</span>还没有记录<br>点右上角「+」添加第一条吧</div>`;
  const tagMap = {weight:['健康档案','health'], vaccine:['健康档案','health'], deworm:['健康档案','health'], health:['健康档案','health'], daily:['养宠日常',''], milestone:['成长里程碑','']};
  return list.map(r=>{
    const [label, cls] = tagMap[r.type] || ['记录',''];
    const icon = r.photo
      ? `<img src="${r.photo}">`
      : ({weight:'⚖️',vaccine:'💉',deworm:'🐛',health:'🩺',daily:'📷',milestone:'🏆'}[r.type]||'📌');
    return `
      <div class="tl-item">
        <div class="tl-rail"><div class="tl-dot">${icon}</div><div class="tl-line"></div></div>
        <div class="tl-body">
          <div class="tl-date">${fmtMD(r.date)} · ${rel(r.date)}${r.kg?` · ${r.kg}kg`:''}</div>
          <div class="tl-card">
            <div class="tl-title">${esc(r.title||'')}</div>
            ${r.desc?`<div class="tl-desc">${esc(r.desc)}</div>`:''}
            <div class="tl-tag ${cls}">${label}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

function verticalTimelineHTML(pet){
  const list = db[pet.id].records.slice().sort((a,b)=>b.date-a.date);
  if(!list.length) return `<div class="empty"><span class="e">🐾</span>还没有记录</div>`;
  return `<div class="vtl">${list.map((r,i)=>{

function miniWeightSVG(pet){
  const data = weightRecords(pet).slice(-6);
  if(data.length<2) return '';
  const W=100,H=36,pad=4;
  const vals=data.map(d=>d.kg);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<0.5){const c=(max+min)/2;min=c-0.25;max=c+0.25;}
  const X=i=>pad+(W-2*pad)*i/(data.length-1);
  const Y=v=>pad+(H-2*pad)*(1-(v-min)/(max-min));
  const pts=data.map((d,i)=>[X(i),Y(d.kg)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const color = isSenior(pet) ? '#7C6BE0' : '#FF7A59';
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:36px;display:block">
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.8"/>
  </svg>`;
}

function triageHTML(){
  if(!triage) return '';
  if(triage.step===0){
    return `
      <div class="sheet-mask" data-act="closeSheet"></div>
      <div class="sheet-body">
        <button class="triage-back" data-act="closeSheet">← 关闭</button>
        <h4 class="sheet-title">症状自查</h4>
        <p class="sheet-sub">为 ${currentPet().name} 选择最接近的系统</p>
        <div class="triage-progress"><div class="tp-seg on"></div><div class="tp-seg"></div><div class="tp-seg"></div><div class="tp-seg"></div></div>
        <div class="type-grid">
          ${TRIAGE_SYSTEMS.map(s=>`<button class="type-btn" data-act="triageSystem" data-id="${s.id}"><i>${s.icon}</i>${s.label}</button>`).join('')}
        </div>
        <div class="triage-note">⚠️ 本工具不替代兽医诊断，仅提供判断参考</div>
      </div>`;
  }
  if(triage.step===1){
    const sys = TRIAGE_SYSTEMS.find(s=>s.id===triage.system);
    return `
      <div class="sheet-mask" data-act="closeSheet"></div>
      <div class="sheet-body">
        <button class="triage-back" data-act="triageBack">← 上一步</button>
        <h4 class="sheet-title">${sys.icon} ${sys.label}</h4>
        <p class="sheet-sub">选择最接近的症状</p>
        <div class="triage-progress"><div class="tp-seg on"></div><div class="tp-seg on"></div><div class="tp-seg"></div><div class="tp-seg"></div></div>
        ${sys.symptoms.map(s=>`<button class="triage-opt" data-act="triageSymptom" data-id="${s.id}"><span>${s.label}</span><span class="to-arrow">›</span></button>`).join('')}
        <div class="triage-note">⚠️ 本工具不替代兽医诊断</div>
      </div>`;
  }
  if(triage.step===2){
    const q = TRIAGE_QS[triage.qIndex];
    const progress = [1,2,3,4].map(i=>`<div class="tp-seg ${i<=triage.qIndex+1?'on':''}"></div>`).join('');
    return `
      <div class="sheet-mask" data-act="closeSheet"></div>
      <div class="sheet-body">
        <button class="triage-back" data-act="triageBack">← 上一步</button>
        <h4 class="sheet-title">问题 ${triage.qIndex+1} / ${TRIAGE_QS.length}</h4>
        <div class="triage-progress">${progress}</div>
        <p class="triage-q">${q.q}</p>
        <p class="triage-hint">${q.hint}</p>
        ${q.opts.map((o,i)=>`<button class="triage-opt" data-act="triageAnswer" data-i="${i}"><span class="to-emoji">${o.emoji}</span><span>${o.t}</span><span class="to-arrow">›</span></button>`).join('')}
        <div class="triage-note">⚠️ 本工具不替代兽医诊断</div>
      </div>`;
  }
  if(triage.step===3){
    const info = SYMPTOM_INFO[triage.symptom] || {ai:'请尽快咨询兽医。', tagMatch:[]};
    const score = triage.answers.reduce((a,ans)=>a + TRIAGE_QS[ans.qIdx].opts[ans.optIdx].w, 0);
    let level = 'green';
    if(score>=6) level='red'; else if(score>=3) level='yellow';
    const levelMap = {
      green:{icon:'🟢',title:'居家观察',sub:'暂无紧急信号，可先在家护理观察'},
      yellow:{icon:'🟡',title:'建议 24h 内就诊',sub:'有需要关注的表现，建议尽快预约'},
      red:{icon:'🔴',title:'请立即就医',sub:'存在危险信号，请马上联系医院或急诊'}
    };
    const L = levelMap[level];
    const matched = posts.filter(p=>p.tags.some(t=>info.tagMatch.some(m=>t.includes(m)))).slice(0,3);
    const caseBlock = matched.length ? `
      <div class="case-title">相似案例 <span>点击查看完整帖子</span></div>
      ${matched.map(post=>`
        <button class="case-card" data-act="goPost" data-post="${post.id}">
          <div class="case-avatar">${post.avatar}</div>
          <div class="case-main">
            <div class="case-user">${post.user} <span class="cu-pet">· ${post.pet}</span></div>
            <div class="case-text">${esc(post.text)}</div>
          </div>
          <div class="case-go">›</div>
        </button>`).join('')}
    ` : '';
    return `
      <div class="sheet-mask" data-act="closeSheet"></div>
      <div class="sheet-body">
        <button class="triage-back" data-act="closeSheet">← 关闭</button>
        <h4 class="sheet-title">分诊结果</h4>
        <p class="sheet-sub">基于 ${currentPet().name} 的品种、年龄与你的回答</p>
        <div class="result-light ${level}">
          <div class="rl-icon">${L.icon}</div>
          <div><div class="rl-title">${L.title}</div><div class="rl-sub">${L.sub}</div></div>
        </div>
        <div class="ai-card">
          <div class="ai-head"><div class="ai-icon">✨</div><div class="ai-title">AI 解读</div></div>
          <div class="ai-body">${info.ai}</div>
        </div>
        ${caseBlock}
        <div class="triage-note" style="margin-top:18px">⚠️ 本工具不替代兽医诊断，案例仅供参考<br>如情况紧急，请直接联系宠物医院</div>
      </div>`;
  }
  return '';
}

function renderSheet(){
  const el = document.getElementById('sheet');
  if(!sheet){ el.classList.remove('open'); el.innerHTML=''; return; }
  let html = '';
  if(sheet==='add') html = addSheetHTML();
  else if(sheet==='pet') html = petSheetHTML();
  else if(sheet==='triage') html = triageHTML();
  else if(sheet==='handover') html = handoverHTML();
  el.innerHTML = html;
  requestAnimationFrame(()=>el.classList.add('open'));
  if(draftType==='weight') setTimeout(()=>{ const i=document.getElementById('inpKg'); if(i) i.focus(); }, 320);
  else if(draftType) setTimeout(()=>{ const i=document.getElementById('inp'); if(i) i.focus(); }, 320);
}

function render(){
  document.getElementById('topbar').innerHTML = topbarHTML();
  document.getElementById('tabbar').innerHTML = tabbarHTML();
  const view = document.getElementById('view');
  view.innerHTML = state.tab==='timeline' ? timelineView()
                 : state.tab==='health'   ? healthView()
                 : state.tab==='nearby'   ? nearbyView()
                 : communityView();
  view.scrollTop = 0;
  renderSheet();
}

function goToPost(postId){
  sheet = null; triage = null; draftType = null;
  state.topicFilter = 'all'; // 确保目标帖子可见
  state.tab = 'community';
  render();
  setTimeout(()=>{
    const el = document.getElementById(postId);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'), 2600);
    }
  }, 180);
}

async function handlePhotoUpload(file){
  const prog = document.getElementById('cutProgress');
  const preview = document.querySelector('.pu-preview');
  if(prog) prog.style.display = 'flex';
  try{
    if(removeBgFn && removeBgState==='ready'){
      const blob = await removeBgFn(file);
      const url = URL.createObjectURL(blob);
      draftPhoto = {url, cut:true};
    } else {
      const dataUrl = await fileToDataURL(file);
      draftPhoto = {url:dataUrl, cut:false};
    }
    if(preview) preview.innerHTML = `<img src="${draftPhoto.url}">`;
  }catch(e){
    const dataUrl = await fileToDataURL(file);
    draftPhoto = {url:dataUrl, cut:false};
    if(preview) preview.innerHTML = `<img src="${draftPhoto.url}">`;
  } finally {
    if(prog) prog.style.display = 'none';
  }
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act==='tab'){ state.tab = el.dataset.t; render(); }
  else if(act==='growthView'){ state.growthView = el.dataset.v; render(); }
  else if(act==='gotoGrowth'){ state.tab='timeline'; state.growthView='chart'; render(); }
  else if(act==='add'){
    sheet='add'; draftType=null; draftPhoto=null; draftKg=''; draftNote=''; draftPetId=state.currentId;
    draftDate = fmtYMD(new Date()); draftTime = new Date().toTimeString().slice(0,5);
    renderSheet();
  }
  else if(act==='switchPet'){ sheet='pet'; renderSheet(); }
  else if(act==='closeSheet'){ sheet=null; draftType=null; triage=null; draftPhoto=null; renderSheet(); }
  // 切换记录类型时重置照片
  else if(act==='pickType'){ draftType = el.dataset.k; draftPhoto=null; renderSheet(); }
  else if(act==='backType'){ draftType = null; draftPhoto=null; renderSheet(); }
  else if(act==='pickPet'){ draftPetId = el.dataset.id; renderSheet(); }
  else if(act==='uploadPhoto'){ e.preventDefault(); const inp = document.getElementById('photoInput'); if(inp) inp.click(); }
  else if(act==='selectPet'){ state.currentId = el.dataset.id; lifeDraft = null; sheet=null; render(); }
  else if(act==='addPet'){
    const n = state.pets.length+1;
    const np = {id:'p'+n, name:'新宠物', breed:'待填写', emoji:'🐾', gender:'—', birth:daysAgo(30), photo:null};
    state.pets.push(np);
    db[np.id] = {records:[], vaccines:[], deworm:[], lifeScores:null};
    state.currentId = np.id; lifeDraft = null; sheet=null; render();
  }
  else if(act==='saveWeight'){
    const kgEl = document.getElementById('inpKg');
    const noteEl = document.getElementById('inpNote');
    const dateEl = document.getElementById('inpDate');
    const timeEl = document.getElementById('inpTime');
    const kg = parseFloat(kgEl.value);
    if(!kg || kg<=0){ kgEl.focus(); return; }
    const note = noteEl.value.trim();
    const dstr = dateEl.value || fmtYMD(new Date());
    const dateObj = new Date(dstr+'T'+(timeEl.value||'12:00')+':00');
    const d = db[draftPetId];
    d.records.push({
      id:uid(), type:'weight', date:dateObj, kg:+kg.toFixed(1),
      photo: draftPhoto ? draftPhoto.url : null,
      title: `${kg.toFixed(1)}kg${note?' · '+note:''}`,
      desc: note || ''
    });
    const targetPet = state.pets.find(p=>p.id===draftPetId);
    if(draftPhoto && !targetPet.photo){ targetPet.photo = draftPhoto.url; }
    sheet=null; draftType=null; draftPhoto=null; draftKg=''; draftNote='';
    render();
  }
  else if(act==='saveSimple'){
    const inp = document.getElementById('inp');
    if(!inp) return;
    const txt = inp.value.trim();
    if(!txt){ inp.focus(); return; }
    const d = db[state.currentId];
    d.records.push({
      id:uid(), type:draftType, date:new Date(), title:txt, desc:'',
      photo: draftPhoto ? draftPhoto.url : null
    });
    const tp = currentPet();
    if(draftPhoto && !tp.photo){ tp.photo = draftPhoto.url; }
    sheet=null; draftType=null; draftPhoto=null;
    render();
  }
  // ===== 点赞：DOM 局部更新，不重新渲染（不跳顶部） =====
  else if(act==='like'){
    const i = +el.dataset.i;
    const post = posts[i];
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    el.classList.toggle('liked', post.liked);
    const span = el.querySelector('span');
    if(span) span.textContent = post.likes;
    el.innerHTML = `${post.liked?'❤️':'🤍'} <span>${post.likes}</span>`;
    el.classList.toggle('liked', post.liked);
  }
  // ===== 切换评论区展开/收起 =====
  else if(act==='toggleComments'){
    const postId = el.dataset.post;
    const box = document.getElementById('comments-'+postId);
    if(box){
      box.classList.toggle('open');
      if(box.classList.contains('open')){
        const inp = document.getElementById('comment-input-'+postId);
        if(inp) setTimeout(()=>inp.focus(), 80);
      }
    }
  }
  // ===== 发送评论 =====
  else if(act==='sendComment'){
    const postId = el.dataset.post;
    const post = posts.find(p=>p.id===postId);
    if(!post) return;
    const inp = document.getElementById('comment-input-'+postId);
    if(!inp) return;
    const txt = inp.value.trim();
    if(!txt){ inp.focus(); return; }
    const newC = {user:'我', avatar:'🙋', text:txt, time:'刚刚'};
    post.commentsList.push(newC);
    const list = document.getElementById('comment-list-'+postId);
    if(list){
      const emptyEl = list.querySelector('.comment-empty');
      if(emptyEl) emptyEl.remove();
      const div = document.createElement('div');
      div.innerHTML = commentItemHTML(newC);
      list.appendChild(div.firstElementChild);
    }
    inp.value = '';
    const countEl = document.getElementById('comment-count-'+postId);
    if(countEl) countEl.textContent = post.commentsList.length;
    inp.focus();
  }
  else if(act==='hello'){
    const i = +el.dataset.i;
    friends[i].hello = !friends[i].hello;
    el.classList.toggle('done', friends[i].hello);
    el.textContent = friends[i].hello ? '已打招呼' : '打招呼';
  }
  else if(act==='viewDaily'){
    const f = friends[+el.dataset.i];
    if(f.postIds.length){ goToPost(f.postIds[f.postIds.length-1]); }
  }
  else if(act==='nearbyMode'){
    state.nearbyMode = el.dataset.m;
    if(state.nearbyMode==='care' && !state.nearbyLoading){
      state.nearbyLoading = true;
      careMatchSeed = Math.floor(Math.random()*100)+1;
      render();
      setTimeout(()=>{ state.nearbyLoading=false; render(); }, 1000);
      return;
    }
    render();
  }
  else if(act==='careFilter'){ currentCareFilter = el.dataset.f; render(); }
  else if(act==='loc'){ el.textContent = el.textContent==='切换位置' ? '定位中…' : '切换位置'; setTimeout(()=>render(), 700); }
  // ===== 话题筛选 =====
  else if(act==='topic'){
    state.topicFilter = el.dataset.tag;
    state.tab = 'community';
    render();
  }
  else if(act==='openTriage'){ triage = {step:0, system:null, symptom:null, qIndex:0, answers:[]}; sheet='triage'; renderSheet(); }
  else if(act==='triageSystem'){ triage.system = el.dataset.id; triage.step=1; renderSheet(); }
  else if(act==='triageSymptom'){ triage.symptom = el.dataset.id; triage.step=2; triage.qIndex=0; triage.answers=[]; renderSheet(); }
  else if(act==='triageAnswer'){
    const oi = +el.dataset.i;
    triage.answers.push({qIdx:triage.qIndex, optIdx:oi});
    if(triage.qIndex < TRIAGE_QS.length-1){ triage.qIndex++; renderSheet(); }
    else { triage.step=3; renderSheet(); }
  }
  else if(act==='triageBack'){
    if(triage.step===0){ sheet=null; triage=null; renderSheet(); }
    else if(triage.step===1){ triage.step=0; triage.system=null; renderSheet(); }
    else if(triage.step===2){
      if(triage.qIndex===0){ triage.step=1; triage.symptom=null; }
      else { triage.qIndex--; triage.answers.pop(); }
      renderSheet();
    }
    else if(triage.step===3){ triage.step=2; triage.qIndex=TRIAGE_QS.length-1; renderSheet(); }
  }
  else if(act==='goPost'){ goToPost(el.dataset.post); }
  else if(act==='saveLifeScore'){
    const p = currentPet(); const d = db[p.id];
    if(!d.lifeScores) d.lifeScores = [];
    d.lifeScores.push({date:new Date(today), scores:[...lifeDraft]});
    const total = lifeDraft.reduce((a,b)=>a+b,0);
    const labels = ['疼痛','食欲','活动','情绪','睡眠'];
    d.records.unshift({id:uid(), type:'health', date:new Date(today), title:`生活质量评分 ${total}/25`, desc:labels.map((l,i)=>l+' '+lifeDraft[i]).join(' · '), photo:null});
    render();
  }
  else if(act==='openHandover'){ handoverPetId = state.currentId; sheet='handover'; renderSheet(); }
  else if(act==='copyHandover'){
    const p = currentPet();
    const txt = `【${p.name} · 交接卡】\n喂食量 / 忌口 / 疫苗 / 驱虫 / 紧急联系人 / 兽医电话 / 摄像头权限 / 特殊习惯 / 应急处理 —— 已生成`;
    const done = ()=>{ const b = document.querySelector('[data-act="copyHandover"]'); if(b){ b.textContent='已复制 ✓'; setTimeout(()=>{ b.textContent='复制交接卡文本'; }, 1500); } };
    if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done).catch(done); } else { done(); }
  }
});

document.addEventListener('input', e=>{
  if(e.target && e.target.dataset && e.target.dataset.act === 'scoreChange'){
    const i = +e.target.dataset.i;
    lifeDraft[i] = +e.target.value;
    const el = document.getElementById('score-val-'+i);
    if(el) el.textContent = e.target.value;
    const tEl = document.getElementById('score-total');
    if(tEl) tEl.textContent = lifeDraft.reduce((a,b)=>a+b,0);
  }
  if(e.target && e.target.id==='inpKg'){ draftKg = e.target.value; }
  if(e.target && e.target.id==='inpNote'){ draftNote = e.target.value; }
  if(e.target && e.target.id==='inpDate'){ draftDate = e.target.value; }
  if(e.target && e.target.id==='inpTime'){ draftTime = e.target.value; }
});

document.addEventListener('change', async e=>{
  if(e.target && e.target.id==='photoInput'){
    const file = e.target.files && e.target.files[0];
    if(file) await handlePhotoUpload(file);
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    if(e.target && e.target.id && e.target.id.startsWith('comment-input-')){
      e.preventDefault();
      const postId = e.target.id.replace('comment-input-','');
      const btn = document.querySelector(`[data-act="sendComment"][data-post="${postId}"]`);
      if(btn) btn.click();
      return;
    }
    if(e.target && e.target.id==='inp'){ const btn = document.querySelector('[data-act="saveSimple"]'); if(btn) btn.click(); }
    if(e.target && e.target.id==='inpKg'){ const btn = document.querySelector('[data-act="saveWeight"]'); if(btn) btn.click(); }
  }
});

render();
</script>
</body>
</html>
